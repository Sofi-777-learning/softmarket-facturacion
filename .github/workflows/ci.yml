name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov ruff black mypy
      - run: ruff check .
      - run: black --check .
      - run: mypy
      - run: pytest --cov=facturacion --cov-fail-under=80
