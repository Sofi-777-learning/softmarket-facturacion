[project]
name = "softmarket-facturacion"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 88
extend-exclude = "legacy"

[tool.ruff]
line-length = 88
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
strict = true
files = ["src"]
